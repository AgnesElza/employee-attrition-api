name: drift-report

on:
  schedule:
    - cron: "0 9 * * 1"     # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate drift report
        run: python drift_monitor/generate_drift_report.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh Evidently drift report"
          title: "chore: refresh Evidently drift report"
          body: |
            Weekly drift report update.
            
            This PR was auto-generated by the `drift-report` workflow.
          branch: drift-report-update
          delete-branch: true
          base: main
